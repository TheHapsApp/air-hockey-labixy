<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Air Hockey!</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏒</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-user-select: none; user-select: none; }
    body {
      font-family: "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
      min-height: 100vh;
      color: #fff;
      text-align: center;
      background: linear-gradient(120deg, #3fd0ff, #8a5cff, #ff6fb0);
      background-size: 300% 300%;
      animation: flow 12s ease infinite;
      padding: 18px 12px 40px;
    }
    @keyframes flow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 { font-size: clamp(1.6rem, 6.5vw, 2.6rem); text-shadow: 3px 3px 0 rgba(0,0,0,0.2); }
    .sub { font-size: clamp(0.9rem, 3vw, 1.1rem); margin: 6px 0 14px; opacity: 0.95; }

    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .chip {
      font-family: inherit;
      font-weight: bold;
      font-size: 1rem;
      color: #6a2cff;
      background: #fff;
      border: 3px solid #fff;
      border-radius: 18px;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }
    .chip:active { transform: translateY(2px); box-shadow: none; }
    .chip.on { background: #ffd23f; color: #a04; border-color: #a04; transform: scale(1.06); }

    #frictionCard {
      max-width: 320px;
      margin: 14px auto 6px;
      background: rgba(255,255,255,0.2);
      border: 3px solid #fff;
      border-radius: 18px;
      padding: 10px 16px;
    }
    #frictionCard label { font-weight: bold; font-size: 0.95rem; display: block; margin-bottom: 4px; }
    #frictionSlider { width: 100%; }

    #scoreBar {
      display: flex;
      justify-content: space-between;
      max-width: 460px;
      margin: 14px auto 8px;
      font-weight: bold;
      font-size: clamp(0.95rem, 3.6vw, 1.2rem);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.18);
    }

    #tableWrap {
      position: relative;
      max-width: 460px;
      margin: 0 auto;
    }
    #table {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      border: 5px solid #fff;
      box-shadow: 0 8px 0 rgba(0,0,0,0.22);
      touch-action: none;
      background: #dff3ff;
    }
    #overlayMsg {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: rgba(30, 10, 50, 0.55);
      border-radius: 14px;
      text-align: center;
      padding: 16px;
    }
    #overlayMsg .big {
      font-size: clamp(1.3rem, 6vw, 2rem);
      font-weight: bold;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
    }
    #overlayMsg .small { font-size: 0.95rem; opacity: 0.9; }

    .btnRow { margin-top: 16px; }
    .btn {
      font-family: inherit;
      font-weight: bold;
      font-size: clamp(1rem, 4.2vw, 1.4rem);
      color: #1a6e2e;
      background: #5fff8f;
      border: 4px solid #fff;
      border-radius: 24px;
      padding: 12px 26px;
      margin: 6px 8px 0;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.22);
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,0.22); }
    .btn.small { font-size: 0.95rem; color: #b23; background: #fff; padding: 9px 16px; }
  </style>
</head>
<body>
  <h1>🏒 Air Hockey!</h1>
  <p class="sub">Pick a difficulty, then drag your paddle to play. Best of 5 pucks wins!</p>

  <div class="row" id="difficultyRow">
    <button class="chip" data-diff="easy">😊 Easy</button>
    <button class="chip" data-diff="medium">🙂 Medium</button>
    <button class="chip" data-diff="hard">😤 Hard</button>
  </div>

  <div id="frictionCard">
    <label for="frictionSlider">🧊 Friction (slippery ↔ sticky)</label>
    <input type="range" id="frictionSlider" min="0" max="10" value="2">
  </div>

  <div id="scoreBar">
    <span id="youScoreLbl">You: 0</span>
    <span id="puckCounterLbl">Puck 0 / 5</span>
    <span id="cpuScoreLbl">CPU: 0</span>
  </div>

  <div id="tableWrap">
    <canvas id="table" width="460" height="700"></canvas>
    <div id="overlayMsg">
      <div class="big" id="overlayBig"></div>
      <div class="small" id="overlaySmall"></div>
      <button class="btn" id="overlayPlayAgain" style="display:none;">🔄 Play Again</button>
    </div>
  </div>

  <div class="btnRow">
    <button class="btn small" id="newMatchBtn">🔄 New Match</button>
  </div>

  <script>
    var TABLE_W = 460, TABLE_H = 700;
    var CENTER_Y = TABLE_H / 2;
    var PADDLE_R = 32, PUCK_R = 18;
    var GOAL_HALF_W = 84;
    var CPU_DEFENSE_Y = PADDLE_R + 60;
    var MAX_PUCK_SPEED = 20;

    var DIFFICULTY = {
      easy:   { aiSpeed: 4.0, aiError: 57, serveSpeed: 4.3, label: "😊 Easy" },
      medium: { aiSpeed: 6.2, aiError: 24, serveSpeed: 6.2, label: "🙂 Medium" },
      hard:   { aiSpeed: 8.9, aiError: 7,  serveSpeed: 8.4, label: "😤 Hard" }
    };

    var canvas = document.getElementById("table");
    var ctx = canvas.getContext("2d");

    var player = { x: TABLE_W / 2, y: TABLE_H - 95, vx: 0, vy: 0, targetX: TABLE_W / 2, targetY: TABLE_H - 95 };
    var cpu = { x: TABLE_W / 2, y: 95, vx: 0, vy: 0, jitterX: 0 };
    var puck = { x: TABLE_W / 2, y: CENTER_Y, vx: 0, vy: 0 };

    var currentDiff = null;
    var youScore = 0, cpuScore = 0, puckCount = 0;
    var state = "idle"; // idle | playing | paused | gameover
    var loopStarted = false;

    function frictionFactor() {
      var v = parseFloat(document.getElementById("frictionSlider").value);
      return 1 - (v * 0.0035);
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function updateScoreBar() {
      document.getElementById("youScoreLbl").textContent = "You: " + youScore;
      document.getElementById("cpuScoreLbl").textContent = "CPU: " + cpuScore;
      document.getElementById("puckCounterLbl").textContent = "Puck " + puckCount + " / 5";
    }

    function showOverlay(big, small, persistent) {
      document.getElementById("overlayBig").textContent = big;
      document.getElementById("overlaySmall").textContent = small || "";
      document.getElementById("overlayPlayAgain").style.display = persistent ? "inline-block" : "none";
      document.getElementById("overlayMsg").style.display = "flex";
    }
    function hideOverlay() {
      document.getElementById("overlayMsg").style.display = "none";
    }

    function resetPaddles() {
      player.x = TABLE_W / 2; player.y = TABLE_H - 95; player.vx = 0; player.vy = 0;
      player.targetX = player.x; player.targetY = player.y;
      cpu.x = TABLE_W / 2; cpu.y = 95; cpu.vx = 0; cpu.vy = 0;
    }

    function servePuck() {
      puck.x = TABLE_W / 2;
      puck.y = CENTER_Y;
      var diff = DIFFICULTY[currentDiff];
      var dir = Math.random() < 0.5 ? 1 : -1;
      var spread = (Math.random() - 0.5) * 2;
      puck.vx = spread * diff.serveSpeed * 0.6;
      puck.vy = dir * diff.serveSpeed;
    }

    function startMatch(diff) {
      currentDiff = diff;
      document.querySelectorAll("#difficultyRow .chip").forEach(function (c) {
        c.classList.toggle("on", c.getAttribute("data-diff") === diff);
      });
      youScore = 0; cpuScore = 0; puckCount = 0;
      resetPaddles();
      updateScoreBar();
      hideOverlay();
      servePuck();
      state = "playing";
      if (!loopStarted) { loopStarted = true; requestAnimationFrame(loop); }
    }

    function handleGoal(scorer) {
      if (scorer === "you") youScore++; else cpuScore++;
      puckCount++;
      updateScoreBar();
      state = "paused";
      showOverlay(scorer === "you" ? "🥅 You scored!" : "🥅 CPU scored!", "", false);
      setTimeout(function () {
        if (puckCount >= 5) {
          endMatch();
        } else {
          hideOverlay();
          resetPaddles();
          servePuck();
          state = "playing";
        }
      }, 1100);
    }

    function endMatch() {
      state = "gameover";
      var result = youScore > cpuScore ? "🎉 You Win!" : (youScore < cpuScore ? "😅 CPU Wins!" : "🤝 Tie Game!");
      showOverlay(result, "Final score — You: " + youScore + "  CPU: " + cpuScore, true);
    }

    function updatePhysics() {
      if (state !== "playing") return;

      // player paddle: velocity derived from movement since last frame
      player.vx = player.targetX - player.x;
      player.vy = player.targetY - player.y;
      player.x = player.targetX;
      player.y = player.targetY;

      // AI paddle
      var diff = DIFFICULTY[currentDiff];
      var targetX, targetY;
      if (puck.y < CENTER_Y * 0.9) {
        // puck is on the AI's side: track it closely to defend/attack
        targetX = puck.x;
        targetY = Math.min(puck.y, CENTER_Y - PADDLE_R);
      } else {
        // puck is on the player's side: guard the middle instead of
        // camping in a corner wherever the puck happens to be parked
        targetX = TABLE_W / 2 + (puck.x - TABLE_W / 2) * 0.3;
        targetY = CPU_DEFENSE_Y;
      }
      cpu.jitterFrames = (cpu.jitterFrames || 0) - 1;
      if (cpu.jitterFrames <= 0) {
        cpu.jitterX = (Math.random() - 0.5) * diff.aiError;
        cpu.jitterFrames = 12;
      }
      targetX = clamp(targetX + cpu.jitterX, PADDLE_R, TABLE_W - PADDLE_R);
      targetY = clamp(targetY, PADDLE_R, CENTER_Y - PADDLE_R);

      var oldCpuX = cpu.x, oldCpuY = cpu.y;
      var dx = targetX - cpu.x, dy = targetY - cpu.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > diff.aiSpeed) {
        cpu.x += (dx / dist) * diff.aiSpeed;
        cpu.y += (dy / dist) * diff.aiSpeed;
      } else {
        cpu.x = targetX; cpu.y = targetY;
      }
      cpu.vx = cpu.x - oldCpuX;
      cpu.vy = cpu.y - oldCpuY;

      // puck movement + friction
      puck.x += puck.vx;
      puck.y += puck.vy;
      var ff = frictionFactor();
      puck.vx *= ff;
      puck.vy *= ff;

      // side wall bounce
      if (puck.x - PUCK_R < 0) { puck.x = PUCK_R; puck.vx = -puck.vx; }
      if (puck.x + PUCK_R > TABLE_W) { puck.x = TABLE_W - PUCK_R; puck.vx = -puck.vx; }

      // top edge: CPU goal or wall
      if (puck.y - PUCK_R < 0) {
        if (puck.x > TABLE_W / 2 - GOAL_HALF_W && puck.x < TABLE_W / 2 + GOAL_HALF_W) {
          handleGoal("you");
          return;
        } else {
          puck.y = PUCK_R; puck.vy = -puck.vy;
        }
      }
      // bottom edge: player goal or wall
      if (puck.y + PUCK_R > TABLE_H) {
        if (puck.x > TABLE_W / 2 - GOAL_HALF_W && puck.x < TABLE_W / 2 + GOAL_HALF_W) {
          handleGoal("cpu");
          return;
        } else {
          puck.y = TABLE_H - PUCK_R; puck.vy = -puck.vy;
        }
      }

      collide(player);
      collide(cpu);

      var speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
      if (speed > MAX_PUCK_SPEED) {
        puck.vx = (puck.vx / speed) * MAX_PUCK_SPEED;
        puck.vy = (puck.vy / speed) * MAX_PUCK_SPEED;
      }
    }

    function collide(paddle) {
      var dx = puck.x - paddle.x, dy = puck.y - paddle.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
      if (dist < PADDLE_R + PUCK_R) {
        var nx = dx / dist, ny = dy / dist;
        var overlap = (PADDLE_R + PUCK_R) - dist;
        puck.x += nx * overlap;
        puck.y += ny * overlap;
        var speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
        var paddleSpeed = Math.sqrt(paddle.vx * paddle.vx + paddle.vy * paddle.vy);
        var newSpeed = Math.max(speed, 3) + paddleSpeed * 0.7;
        puck.vx = nx * newSpeed + paddle.vx * 0.35;
        puck.vy = ny * newSpeed + paddle.vy * 0.35;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, TABLE_W, TABLE_H);

      // table surface
      var grad = ctx.createLinearGradient(0, 0, 0, TABLE_H);
      grad.addColorStop(0, "#dff3ff");
      grad.addColorStop(1, "#cfe9ff");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, TABLE_W, TABLE_H);

      // center line
      ctx.strokeStyle = "rgba(106,44,255,0.5)";
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, CENTER_Y);
      ctx.lineTo(TABLE_W, CENTER_Y);
      ctx.stroke();
      ctx.setLineDash([]);

      // center circle
      ctx.beginPath();
      ctx.arc(TABLE_W / 2, CENTER_Y, 60, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(106,44,255,0.35)";
      ctx.lineWidth = 3;
      ctx.stroke();

      // goal mouths
      ctx.fillStyle = "rgba(255,111,176,0.5)";
      ctx.fillRect(TABLE_W / 2 - GOAL_HALF_W, 0, GOAL_HALF_W * 2, 8);
      ctx.fillStyle = "rgba(63,208,255,0.5)";
      ctx.fillRect(TABLE_W / 2 - GOAL_HALF_W, TABLE_H - 8, GOAL_HALF_W * 2, 8);

      // cpu paddle
      drawPaddle(cpu.x, cpu.y, "#ff6fb0");
      // player paddle
      drawPaddle(player.x, player.y, "#3fd0ff");

      // puck
      ctx.beginPath();
      ctx.arc(puck.x, puck.y, PUCK_R, 0, Math.PI * 2);
      ctx.fillStyle = "#2a2a3a";
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawPaddle(x, y, color) {
      ctx.beginPath();
      ctx.arc(x, y, PADDLE_R, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.7)";
      ctx.fill();
    }

    function loop() {
      updatePhysics();
      draw();
      requestAnimationFrame(loop);
    }

    // pointer controls (mouse + touch)
    function canvasPoint(evt) {
      var rect = canvas.getBoundingClientRect();
      var clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      var clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      var scaleX = TABLE_W / rect.width;
      var scaleY = TABLE_H / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function setPlayerTarget(pt) {
      player.targetX = clamp(pt.x, PADDLE_R, TABLE_W - PADDLE_R);
      player.targetY = clamp(pt.y, CENTER_Y + PADDLE_R, TABLE_H - PADDLE_R);
    }

    canvas.addEventListener("pointerdown", function (e) {
      setPlayerTarget(canvasPoint(e));
    });
    canvas.addEventListener("pointermove", function (e) {
      setPlayerTarget(canvasPoint(e));
    });

    document.querySelectorAll("#difficultyRow .chip").forEach(function (btn) {
      btn.addEventListener("click", function () { startMatch(btn.getAttribute("data-diff")); });
    });

    document.getElementById("newMatchBtn").addEventListener("click", function () {
      if (currentDiff) startMatch(currentDiff);
    });

    document.getElementById("overlayPlayAgain").addEventListener("click", function () {
      if (currentDiff) startMatch(currentDiff);
    });

    updateScoreBar();
    draw();
    showOverlay("👆 Pick a difficulty to start!", "", false);
  </script>
</body>
</html>
